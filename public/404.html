<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <title>이라이프투어</title>
  <script>
    // GitHub Pages SPA 지원: 알 수 없는 경로는 index.html로 리다이렉트
    // (경로+쿼리+해시를 sessionStorage에 저장 후 복원)
    var l = window.location;
    sessionStorage.setItem('__spa_path', l.pathname + l.search + l.hash);
    l.replace(l.origin + '/');
  </script>
</head>
</html>
