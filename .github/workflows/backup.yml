name: Daily Database Backup

on:
  schedule:
    - cron: '0 15 * * *'  # 매일 00:00 KST (15:00 UTC)
  workflow_dispatch:       # 수동 실행 가능

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -q
          sudo apt-get install -y postgresql-client

      - name: Prefer IPv4
        run: echo "precedence ::ffff:0:0/96 100" | sudo tee -a /etc/gai.conf

      - name: Export database
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGSSLMODE: require
        run: |
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          pg_dump \
            --host=db.fnrghzzqwergwcssybro.supabase.co \
            --port=5432 \
            --username=postgres \
            --dbname=postgres \
            --schema=public \
            --no-owner \
            --no-acl \
            --file=backup_${TIMESTAMP}.sql
          gzip backup_${TIMESTAMP}.sql
          echo "BACKUP_FILE=backup_${TIMESTAMP}.sql.gz" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 90
